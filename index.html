
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUERMAD98 - لعبة أسطورية</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      canvas {
        display: block;
        margin: 0 auto;
      }
      #loading {
        padding: 50px;
        font-size: 20px;
        color: yellow;
      }
    </style>
  </head>
  <body>
    <div id="loading">جاري تحميل لعبة GUERMAD98 ...</div>
    <script src="game.js"></script>
    <script>
      const engine = new Engine();
      engine.startGame({
        canvas: document.createElement("canvas"),
        onProgress: (progress) => {
          document.getElementById("loading").textContent = `جاري التحميل... ${Math.floor(progress * 100)}%`;
        },
        onLoad: () => {
          document.getElementById("loading").remove();
        },
        config: {
          canvasResizePolicy: 2,
          executable: "game",
          locale: "ar",
          args: [],
          canvasMenu: false,
        },
      });
    </script>
  </body>
</html>
